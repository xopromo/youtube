<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Depths v2 — Roguelike</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        h1 {
            color: #ff6b6b;
            font-size: 28px;
            letter-spacing: 8px;
            text-shadow: 0 0 20px #ff6b6b88;
            margin-bottom: 12px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 20px #ff6b6b88; }
            50% { text-shadow: 0 0 40px #ff6b6b; }
        }

        .game-info {
            color: #888;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .layout {
            display: flex;
            gap: 18px;
            align-items: flex-start;
        }

        canvas {
            border: 3px solid #333;
            display: block;
            image-rendering: pixelated;
            background: #0a0a0a;
            box-shadow: 0 0 40px rgba(255,107,107,.3);
        }

        .sidebar {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel {
            background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
            border: 1px solid #333;
            border-top: 1px solid #444;
            padding: 12px 14px;
            border-radius: 4px;
        }

        .panel h3 {
            font-size: 10px;
            color: #ff6b6b;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin: 4px 0;
            align-items: center;
        }
        .sl { color: #666; }
        .sv { color: #4ade80; font-weight: bold; }
        .sv.warn { color: #fbbf24; }
        .sv.danger { color: #ff6b6b; }

        .bar { height: 8px; background: #1a1a1a; margin-top: 6px; border-radius: 2px; }
        .bar-fill { height: 100%; transition: width .2s, background .2s; border-radius: 2px; }

        .abilities {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .ability-icon {
            width: 24px;
            height: 24px;
            background: #1a1a2e;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: help;
            border-radius: 2px;
        }
        .ability-icon:hover { border-color: #4ade80; }

        .inv-item {
            font-size: 12px;
            padding: 6px 8px;
            margin: 3px 0;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .inv-item:hover { background: #1a2a2e; border-color: #333; }
        .inv-item .rarity {
            font-size: 10px;
            opacity: 0.7;
        }
        .rarity-common { color: #aaa; }
        .rarity-rare { color: #4fc3f7; }
        .rarity-epic { color: #9b59b6; }
        .rarity-legend { color: #ffd700; }

        .inv-empty { color: #555; font-size: 12px; }

        .log {
            height: 200px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.8;
        }
        .log::-webkit-scrollbar { width: 4px; }
        .log::-webkit-scrollbar-track { background: #0a0a0a; }
        .log::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .log-msg { padding: 2px 0; }
        .msg-damage { color: #ff6b6b; }
        .msg-kill { color: #ff8c42; font-weight: bold; }
        .msg-item { color: #4ade80; }
        .msg-level { color: #9b59b6; font-weight: bold; }
        .msg-special { color: #4fc3f7; }
        .msg-info { color: #666; }

        .ctrl { font-size: 11px; color: #555; line-height: 2; }
        .ctrl b { color: #888; }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.95);
            justify-content: center;
            align-items: center;
            z-index: 99;
        }
        .overlay.on { display: flex; }

        .modal {
            background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
            border: 2px solid #ff6b6b;
            padding: 40px 60px;
            text-align: center;
            border-radius: 4px;
            min-width: 320px;
        }

        .modal h2 {
            font-size: 36px;
            margin-bottom: 16px;
            animation: bounce 0.6s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .modal p { font-size: 14px; color: #888; margin: 6px 0; }
        .modal p span { color: #4ade80; font-weight: bold; }

        .btn {
            margin-top: 20px;
            padding: 12px 32px;
            background: linear-gradient(135deg, #ff6b6b, #ff8c42);
            color: #fff;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,107,107,.5); }

        .class-select {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        .class-btn {
            padding: 16px;
            background: #1a1a2e;
            border: 2px solid #333;
            color: #e0e0e0;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            transition: all 0.2s;
        }
        .class-btn:hover {
            border-color: #ff6b6b;
            background: #2a2a3e;
        }
        .class-btn .name { font-weight: bold; margin-bottom: 8px; }
        .class-btn .desc { font-size: 10px; color: #888; }
    </style>
</head>
<body>
<h1>🗡 DUNGEON DEPTHS v2 🗡</h1>
<div class="game-info" id="info"></div>

<div class="layout">
    <canvas id="c" width="640" height="480"></canvas>

    <div class="sidebar">

        <div class="panel">
            <h3>⚔ Герой</h3>
            <div class="stat"><span class="sl">HP</span> <span class="sv" id="hp">30</span>/<span id="mhp">30</span></div>
            <div class="bar"><div class="bar-fill" id="hpb"></div></div>
            <div class="stat" style="margin-top:8px"><span class="sl">Класс</span> <span class="sv" id="cls">Воин</span></div>
            <div class="stat"><span class="sl">ATK</span> <span class="sv" id="atk">5</span></div>
            <div class="stat"><span class="sl">DEF</span> <span class="sv" id="def">1</span></div>
            <div class="stat"><span class="sl">Крит</span> <span class="sv" id="crit">15%</span></div>
        </div>

        <div class="panel">
            <h3>📈 Прогресс</h3>
            <div class="stat"><span class="sl">Уровень</span> <span class="sv" id="lvl">1</span></div>
            <div class="stat"><span class="sl">Опыт</span> <span class="sv" id="xp">0</span>/<span id="xpn">25</span></div>
            <div class="bar"><div class="bar-fill" id="xpb"></div></div>
            <div class="stat" style="margin-top:8px"><span class="sl">Этаж</span> <span class="sv" id="fl">1</span>/5</div>
            <div class="stat"><span class="sl">Убийств</span> <span class="sv" id="kl">0</span></div>
        </div>

        <div class="panel">
            <h3>✨ Способности</h3>
            <div class="abilities" id="abilities"></div>
        </div>

        <div class="panel">
            <h3>🎒 Инвентарь [1-5]</h3>
            <div id="inv"><div class="inv-empty">Пусто</div></div>
        </div>

        <div class="panel">
            <h3>📜 Журнал</h3>
            <div class="log" id="log"></div>
        </div>

        <div class="panel ctrl">
            <b>WASD/↑↓←→</b> движение<br>
            <b>1–5</b> предмет<br>
            <b>.</b> пропустить ход
        </div>

    </div>
</div>

<div class="overlay" id="ov">
    <div class="modal">
        <h2 id="mt"></h2>
        <div id="ms"></div>
        <div class="class-select" id="cs"></div>
        <button class="btn" id="btn-play" onclick="startGame()" style="display:none;">Начать игру</button>
        <button class="btn" onclick="location.reload()">Играть снова</button>
    </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════════════════════════════════════════

const COLS = 64, ROWS = 30, TW = 10, TH = 16;
const T = { WALL:0, FLOOR:1, STAIR:2 };

const CLASSES = {
    warrior: {
        name: 'Воин', emoji: '🗡',
        hp: 40, atk: 7, def: 3, crit: 20,
        desc: 'Сильная атака, хорошая защита'
    },
    rogue: {
        name: 'Вор', emoji: '🗡',
        hp: 28, atk: 9, def: 1, crit: 35,
        desc: 'Высокий крит, низкая защита'
    },
    mage: {
        name: 'Маг', emoji: '✨',
        hp: 24, atk: 5, def: 2, crit: 15,
        desc: 'Много маны, магические умения'
    },
};

const ABILITIES = {
    slash: { name: 'Удар', emoji: '⚡', lvl: 1, class: ['warrior', 'rogue'] },
    shield: { name: 'Щит', emoji: '🛡', lvl: 3, class: ['warrior'] },
    backstab: { name: 'Удар в спину', emoji: '💀', lvl: 2, class: ['rogue'] },
    fireball: { name: 'Огненный шар', emoji: '🔥', lvl: 2, class: ['mage'] },
};

const ENEMIES = {
    rat: { n:'Крыса', e:'🐀', hp:6, atk:2, def:0, xp:3, col:'#a0522d', fl:1, boss:false },
    bat: { n:'Летучая мышь', e:'🦇', hp:5, atk:3, def:0, xp:4, col:'#8b7355', fl:1, boss:false },
    goblin: { n:'Гоблин', e:'👹', hp:14, atk:5, def:1, xp:12, col:'#27ae60', fl:1, boss:false },
    orc: { n:'Орк', e:'🗡', hp:22, atk:8, def:2, xp:18, col:'#d35400', fl:2, boss:false },
    skeleton: { n:'Скелет', e:'💀', hp:18, atk:6, def:2, xp:16, col:'#bdc3c7', fl:2, boss:false },
    zombie: { n:'Зомби', e:'🧟', hp:24, atk:7, def:1, xp:20, col:'#95a5a6', fl:2, boss:false },
    troll: { n:'Тролль', e:'👹', hp:36, atk:11, def:4, xp:40, col:'#8e44ad', fl:3, boss:false },
    wyvern: { n:'Виверна', e:'🐉', hp:32, atk:10, def:3, xp:38, col:'#2980b9', fl:3, boss:false },
    lich: { n:'Лич', e:'👻', hp:50, atk:14, def:5, xp:60, col:'#3498db', fl:4, boss:false },
    golem: { n:'Голем', e:'🗿', hp:60, atk:12, def:8, xp:70, col:'#7f8c8d', fl:4, boss:false },
    dragon: { n:'Дракон', e:'🐲', hp:100, atk:20, def:8, xp:150, col:'#e74c3c', fl:5, boss:true },
    demon: { n:'Демон', e:'😈', hp:80, atk:18, def:7, xp:120, col:'#c0392b', fl:5, boss:true },
};

const ITEMS = {
    potion: { n:'Зелье HP', e:'🧪', use:'heal', val:30, rare:'common' },
    potion_big: { n:'Большое зелье', e:'🧪', use:'heal', val:60, rare:'rare' },
    sword: { n:'Меч', e:'🗡', use:'atk', val:3, rare:'common' },
    sword_magic: { n:'Магический клинок', e:'✨', use:'atk', val:7, rare:'epic' },
    shield: { n:'Щит', e:'🛡', use:'def', val:2, rare:'common' },
    shield_epic: { n:'Эпический щит', e:'🛡', use:'def', val:5, rare:'epic' },
    scroll_fire: { n:'Свиток огня', e:'🔥', use:'bomb', val:20, rare:'rare' },
    scroll_ice: { n:'Свиток льда', e:'❄', use:'freeze', val:0, rare:'rare' },
    amulet: { n:'Амулет мудрости', e:'📿', use:'stats', val:2, rare:'epic' },
    ring: { n:'Кольцо воина', e:'💍', use:'stats', val:3, rare:'legend' },
};

const RARITIES = {
    common: '#aaa',
    rare: '#4fc3f7',
    epic: '#9b59b6',
    legend: '#ffd700',
};

// ════════════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════════════

let G, canvas, ctx;

function mkPlayer(cls) {
    const c = CLASSES[cls];
    return {
        x:0, y:0, cls,
        hp: c.hp, mhp: c.hp,
        atk: c.atk, def: c.def, crit: c.crit,
        lvl: 1, xp: 0, xpn: 25,
        inv: [], kills: 0, over: false,
        abilities: [],
    };
}

function mkState(cls) {
    return {
        floor: 1,
        map: [], exp: [], vis: [],
        en: [], it: [],
        msgs: [], turn: 0,
        p: mkPlayer(cls),
    };
}

// ════════════════════════════════════════════════════════════════════════════
// DUNGEON GENERATION
// ════════════════════════════════════════════════════════════════════════════

function gen() {
    const map=[], exp=[], vis=[];
    for(let y=0;y<ROWS;y++){
        map.push(new Uint8Array(COLS));
        exp.push(new Uint8Array(COLS));
        vis.push(new Uint8Array(COLS));
    }

    const rooms=[];
    const want = 8 + G.floor;

    for(let a=0;a<300&&rooms.length<want;a++){
        const w=6+rng(8), h=5+rng(6);
        const rx=1+rng(COLS-w-2), ry=1+rng(ROWS-h-2);
        const r={x:rx,y:ry,w,h};

        if(rooms.some(o=> rx<o.x+o.w+1 && rx+w+1>o.x && ry<o.y+o.h+1 && ry+h+1>o.y)) continue;

        for(let y=ry;y<ry+h;y++) for(let x=rx;x<rx+w;x++) map[y][x]=T.FLOOR;

        if(rooms.length>0){
            const p=rooms[rooms.length-1];
            const x1=~~(p.x+p.w/2), y1=~~(p.y+p.h/2);
            const x2=~~(rx+w/2),    y2=~~(ry+h/2);
            if(Math.random()<.5){ hline(map,x1,x2,y1); vline(map,y1,y2,x2); }
            else                 { vline(map,y1,y2,x1); hline(map,x1,x2,y2); }
        }
        rooms.push(r);
    }

    return {map,exp,vis,rooms};
}

function hline(m,x1,x2,y){ for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++) if(inb(x,y)) m[y][x]=T.FLOOR; }
function vline(m,y1,y2,x){ for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++) if(inb(x,y)) m[y][x]=T.FLOOR; }
function rc(r){ return {x:~~(r.x+r.w/2), y:~~(r.y+r.h/2)}; }
function inb(x,y){ return x>=0&&x<COLS&&y>=0&&y<ROWS; }
function rng(n){ return Math.floor(Math.random()*n); }

function setupFloor(){
    const {map,exp,vis,rooms} = gen();
    G.map=map; G.exp=exp; G.vis=vis; G.en=[]; G.it=[];

    const s=rc(rooms[0]);
    G.p.x=s.x; G.p.y=s.y;

    const e=rc(rooms[rooms.length-1]);
    map[e.y][e.x]=T.STAIR;

    const pool=Object.keys(ENEMIES).filter(k=>ENEMIES[k].fl<=G.floor);

    for(let i=1;i<rooms.length-1;i++){
        const isBossRoom = i === rooms.length-2;
        const cnt = isBossRoom ? 1 : (1+rng(3));
        for(let j=0;j<cnt;j++) {
            if(isBossRoom && j===0) spawnBoss(rooms[i]);
            else spawnEnemy(rooms[i],pool);
        }
        if(Math.random()<.6) spawnItem(rooms[i]);
    }
    spawnItem(rooms[0],'potion');

    fov();
}

function spawnEnemy(room,pool){
    for(let a=0;a<20;a++){
        const x=room.x+1+rng(room.w-2), y=room.y+1+rng(room.h-2);
        if(!anyAt(x,y)){
            const key=pool[rng(pool.length)], t=ENEMIES[key];
            const bonus=G.floor*1.5;
            G.en.push({
                x,y,key,
                hp:~~(t.hp+bonus), mhp:~~(t.hp+bonus),
                atk:~~(t.atk+G.floor*0.3), def:t.def,
            });
            return;
        }
    }
}

function spawnBoss(room){
    const c = rc(room);
    const bosses = ['troll', 'lich', 'golem', 'demon', 'dragon'];
    const key = bosses[Math.min(G.floor-1, bosses.length-1)];
    const t = ENEMIES[key];
    G.en.push({
        x: c.x, y: c.y, key,
        hp: ~~(t.hp * 1.5), mhp: ~~(t.hp * 1.5),
        atk: ~~(t.atk * 1.3), def: t.def + 2,
    });
}

function spawnItem(room,force=null){
    for(let a=0;a<20;a++){
        const x=room.x+1+rng(room.w-2), y=room.y+1+rng(room.h-2);
        if(G.map[y][x]===T.FLOOR && !itemAt(x,y)){
            const keys=Object.keys(ITEMS);
            const key=force||keys[rng(keys.length)];
            G.it.push({x,y,key});
            return;
        }
    }
}

// ════════════════════════════════════════════════════════════════════════════
// FOV
// ════════════════════════════════════════════════════════════════════════════

function fov(){
    for(let y=0;y<ROWS;y++) G.vis[y].fill(0);
    const {x:px,y:py}=G.p, R=8;
    for(let a=0;a<360;a+=3){
        const rad=a*Math.PI/180;
        let rx=px+.5, ry=py+.5;
        for(let s=0;s<R;s++){
            const tx=~~rx, ty=~~ry;
            if(!inb(tx,ty)) break;
            G.vis[ty][tx]=1; G.exp[ty][tx]=1;
            if(G.map[ty][tx]===T.WALL) break;
            rx+=Math.cos(rad)*.5; ry+=Math.sin(rad)*.5;
        }
    }
}

// ════════════════════════════════════════════════════════════════════════════
// LOOKUPS
// ════════════════════════════════════════════════════════════════════════════

function anyAt(x,y){ return (G.p.x===x&&G.p.y===y) || G.en.some(e=>e.x===x&&e.y===y); }
function enemyAt(x,y){ return G.en.find(e=>e.x===x&&e.y===y)||null; }
function itemAt(x,y){ return G.it.find(i=>i.x===x&&i.y===y)||null; }
function walk(x,y){ return inb(x,y) && G.map[y][x]!==T.WALL; }

// ════════════════════════════════════════════════════════════════════════════
// COMBAT
// ════════════════════════════════════════════════════════════════════════════

function calcDmg(a, d) {
    let dmg = a.atk + rng(4) - d.def;
    if(Math.random()*100 < a.crit) dmg = ~~(dmg * 1.5);
    return Math.max(1, dmg);
}

function pAtk(en){
    const d=calcDmg(G.p,en), t=ENEMIES[en.key];
    en.hp-=d;
    if(en.hp<=0){
        msg(`${t.e} ${t.n}: УБИТ! +${t.xp}xp`, 'kill');
        G.en=G.en.filter(e=>e!==en);
        G.p.kills++;
        gainXP(t.xp);
    } else {
        msg(`⚔ ${t.e} −${d} HP (${en.hp}/${en.mhp})`, 'damage');
    }
}

function eAtk(en){
    const d=calcDmg(en,G.p), t=ENEMIES[en.key];
    G.p.hp=Math.max(0,G.p.hp-d);
    msg(`⚠ ${t.e} ${t.n} −${d} HP`, 'damage');
    if(G.p.hp<=0) endGame(false);
}

function gainXP(v){
    G.p.xp+=v;
    while(G.p.xp>=G.p.xpn){
        G.p.xp-=G.p.xpn;
        G.p.lvl++; G.p.xpn=~~(G.p.xpn*1.4);
        G.p.mhp+=8; G.p.hp=Math.min(G.p.hp+8,G.p.mhp);
        G.p.atk+=2; G.p.def+=1; G.p.crit=Math.min(50, G.p.crit+2);

        // unlock abilities
        for(const [k,a] of Object.entries(ABILITIES)){
            if(!G.p.abilities.includes(k) && a.lvl===G.p.lvl && a.class.includes(G.p.cls)){
                G.p.abilities.push(k);
                msg(`✨ Изучена способность: ${a.emoji} ${a.name}`, 'level');
            }
        }
        msg(`📈 Уровень ${G.p.lvl}!`, 'level');
    }
}

// ════════════════════════════════════════════════════════════════════════════
// ITEMS
// ════════════════════════════════════════════════════════════════════════════

function useItem(i){
    const it=G.p.inv[i]; if(!it) return;
    const t=ITEMS[it.key];
    switch(t.use){
        case 'heal':{
            const h=Math.min(t.val, G.p.mhp-G.p.hp);
            G.p.hp+=h; msg(`💊 +${h} HP`, 'item'); break;
        }
        case 'atk':{
            G.p.atk+=t.val; msg(`🗡 ATK +${t.val}`, 'item'); break;
        }
        case 'def':{
            G.p.def+=t.val; msg(`🛡 DEF +${t.val}`, 'item'); break;
        }
        case 'stats':{
            G.p.atk+=1; G.p.def+=1; msg(`⭐ Атака и защита +1`, 'item'); break;
        }
        case 'bomb':{
            const d=t.val;
            G.en.forEach(e=>{ e.hp-=d; if(e.hp<=0) G.p.kills++; });
            G.en=G.en.filter(e=>e.hp>0);
            msg(`🔥 ${d} урона всем!`, 'special');
            break;
        }
        case 'freeze':{
            msg(`❄ Враги замораживаются...`, 'special');
            break;
        }
    }
    G.p.inv.splice(i,1);
    tick();
}

// ════════════════════════════════════════════════════════════════════════════
// MOVEMENT
// ════════════════════════════════════════════════════════════════════════════

function move(dx,dy){
    if(G.p.over) return;
    const nx=G.p.x+dx, ny=G.p.y+dy;
    if(!walk(nx,ny)) return;

    const en=enemyAt(nx,ny);
    if(en){ pAtk(en); tick(); return; }

    G.p.x=nx; G.p.y=ny;

    const it=itemAt(nx,ny);
    if(it) pickup(it);

    if(G.map[ny][nx]===T.STAIR){
        if(G.floor>=5){ endGame(true); return; }
        G.floor++;
        msg(`⬇ Спуск на этаж ${G.floor}...`, 'info');
        setupFloor();
    }

    fov(); tick();
}

function pickup(it){
    if(G.p.inv.length>=5){ msg(`Инвентарь полон`, 'info'); return; }
    G.p.inv.push({key:it.key});
    G.it=G.it.filter(i=>i!==it);
    msg(`📦 ${ITEMS[it.key].e} ${ITEMS[it.key].n}`, 'item');
}

// ════════════════════════════════════════════════════════════════════════════
// ENEMY AI
// ════════════════════════════════════════════════════════════════════════════

function tick(){
    G.turn++;
    for(const en of G.en) if(!G.p.over) aiTurn(en);
    ui(); draw();
}

function aiTurn(en){
    if(!G.vis[en.y][en.x]){
        if(Math.random()<.25){
            const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
            const [dx,dy]=dirs[rng(4)];
            const nx=en.x+dx, ny=en.y+dy;
            if(walk(nx,ny) && !anyAt(nx,ny)){ en.x=nx; en.y=ny; }
        }
        return;
    }
    const dist=Math.abs(en.x-G.p.x)+Math.abs(en.y-G.p.y);
    if(dist===1){ eAtk(en); return; }

    const dx=Math.sign(G.p.x-en.x), dy=Math.sign(G.p.y-en.y);
    if(dx&&walk(en.x+dx,en.y)&&!anyAt(en.x+dx,en.y)){ en.x+=dx; return; }
    if(dy&&walk(en.x,en.y+dy)&&!anyAt(en.x,en.y+dy)){ en.y+=dy; }
}

// ════════════════════════════════════════════════════════════════════════════
// MESSAGES & UI
// ════════════════════════════════════════════════════════════════════════════

function msg(t,cls='info'){ G.msgs.unshift({t,c:cls}); if(G.msgs.length>50) G.msgs.pop(); }
function $(id){ return document.getElementById(id); }

function ui(){
    const p=G.p, c=CLASSES[p.cls];
    $('cls').textContent=c.name;
    $('hp').textContent=p.hp; $('mhp').textContent=p.mhp;
    $('atk').textContent=p.atk; $('def').textContent=p.def; $('crit').textContent=p.crit+'%';
    $('lvl').textContent=p.lvl; $('xp').textContent=p.xp; $('xpn').textContent=p.xpn;
    $('fl').textContent=G.floor; $('kl').textContent=p.kills;

    // Health bar
    const hpPct=p.hp/p.mhp;
    const hpBar=$('hpb');
    hpBar.style.width=(hpPct*100)+'%';
    hpBar.style.background=hpPct>.5?'#4ade80':hpPct>.25?'#fbbf24':'#ff6b6b';

    // XP bar
    const xpPct=p.xp/p.xpn;
    const xpBar=$('xpb');
    xpBar.style.width=(xpPct*100)+'%';
    xpBar.style.background='#9b59b6';

    // Abilities
    const abEl=$('abilities');
    abEl.innerHTML=p.abilities.map(k=>{
        const a=ABILITIES[k];
        return `<div class="ability-icon" title="${a.name}">${a.emoji}</div>`;
    }).join('');

    // Inventory
    const inv=$('inv');
    if(!p.inv.length){ inv.innerHTML='<div class="inv-empty">Пусто</div>'; }
    else inv.innerHTML=p.inv.map((it,i)=>{
        const t=ITEMS[it.key];
        const rareCol=RARITIES[t.rare];
        return `<div class="inv-item" onclick="useItem(${i})" style="color:${rareCol}">
            <span style="color:#444">[${i+1}]</span> ${t.e} <span>${t.n}</span>
            <span class="rarity rarity-${t.rare}" style="color:${rareCol}">${t.rare}</span></div>`;
    }).join('');

    // Log
    const log=$('log');
    log.innerHTML=G.msgs.slice(0,25).map(m=>{
        let cls='log-msg';
        if(m.c==='damage') cls='log-msg msg-damage';
        else if(m.c==='kill') cls='log-msg msg-kill';
        else if(m.c==='item') cls='log-msg msg-item';
        else if(m.c==='level') cls='log-msg msg-level';
        else if(m.c==='special') cls='log-msg msg-special';
        else cls='log-msg msg-info';
        return `<div class="${cls}">${m.t}</div>`;
    }).join('');
}

// ════════════════════════════════════════════════════════════════════════════
// RENDERER
// ════════════════════════════════════════════════════════════════════════════

const TILE_CHARS={ 0:'#', 1:'·', 2:'📍' };
const TILE_COLS={ 0:'#2a2a2a', 1:'#3a3a4a' };

function draw(){
    ctx.fillStyle='#0a0a0a';
    ctx.fillRect(0,0,640,480);

    const vcols=~~(640/TW), vrows=~~(480/TH);
    const cx=Math.max(0,Math.min(G.p.x-~~(vcols/2.5), COLS-vcols));
    const cy=Math.max(0,Math.min(G.p.y-~~(vrows/2.5), ROWS-vrows));

    ctx.font=`bold ${TH-2}px "Courier New"`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';

    for(let vy=0;vy<vrows;vy++){
        for(let vx=0;vx<vcols;vx++){
            const wx=cx+vx, wy=cy+vy;
            if(!inb(wx,wy)) continue;
            const vis=G.vis[wy][wx], exp=G.exp[wy][wx];
            if(!exp) continue;

            const px=vx*TW+TW/2, py=vy*TH+TH/2;
            const tile=G.map[wy][wx];

            let bg, col;
            if(!vis){ bg='#0a0a0a'; col='#1a1a2a'; }
            else {
                if(tile===T.WALL){ bg='#1a1a2a'; col='#444'; }
                else if(tile===T.STAIR){ bg='#2a1a0a'; col='#ffd700'; }
                else{ bg='#111'; col='#3a3a4a'; }
            }

            ctx.fillStyle=bg;
            ctx.fillRect(vx*TW, vy*TH, TW, TH);
            ctx.fillStyle=col;
            ctx.font=`bold ${TH-4}px "Courier New"`;
            ctx.fillText(TILE_CHARS[tile]||' ', px, py);

            if(!vis) continue;

            // items
            const it=itemAt(wx,wy);
            if(it){
                ctx.fillStyle=RARITIES[ITEMS[it.key].rare];
                ctx.font=`${TH-2}px Arial`;
                ctx.fillText(ITEMS[it.key].e, px, py);
            }

            // enemies
            const en=enemyAt(wx,wy);
            if(en){
                const et=ENEMIES[en.key];
                ctx.fillStyle='#0d0d0d';
                ctx.fillRect(vx*TW+1, vy*TH+2, TW-2, TH-2);
                ctx.fillStyle=et.col;
                ctx.font=`${TH-2}px Arial`;
                ctx.fillText(et.e, px, py);

                // hp bar
                const bw=TW-2, f=en.hp/en.mhp;
                ctx.fillStyle='#222'; ctx.fillRect(vx*TW+1, vy*TH, bw, 2);
                ctx.fillStyle=f>.5?'#4ade80':f>.25?'#fbbf24':'#ff6b6b';
                ctx.fillRect(vx*TW+1, vy*TH, ~~(bw*f), 2);
            }
        }
    }

    // player
    const pvx=(G.p.x-cx)*TW, pvy=(G.p.y-cy)*TH;
    ctx.fillStyle='#0d0d0d';
    ctx.fillRect(pvx+1, pvy+2, TW-2, TH-2);
    ctx.fillStyle='#4ade80';
    ctx.font=`${TH-2}px Arial`;
    ctx.fillText('@', pvx+TW/2, pvy+TH/2);
}

// ════════════════════════════════════════════════════════════════════════════
// GAME STATE
// ════════════════════════════════════════════════════════════════════════════

function endGame(won){
    G.p.over=true;
    $('mt').style.color=won?'#4ade80':'#ff6b6b';
    $('mt').textContent=won?'⚔ ПОБЕДА! ⚔':'💀 ТЫ ПОГИБ';
    $('ms').innerHTML=`
        <p>Этаж: <span>${G.floor}/5</span></p>
        <p>Уровень: <span>${G.p.lvl}</span></p>
        <p>Убийств: <span>${G.p.kills}</span></p>
        <p>Ходов: <span>${G.turn}</span></p>`;
    $('ov').classList.add('on');
    document.getElementById('btn-play').style.display='none';
}

function startGame(){
    $('ov').classList.remove('on');
    document.getElementById('cs').innerHTML='';
    G=mkState(G.selectedClass);
    setupFloor();
    msg('Ты входишь в подземелье...', 'info');
    msg('Найди лестницу и спустись вниз', 'info');
    msg('Пять этажей. Удачи!', 'info');
    ui(); draw();
}

function newGame(){
    $('ov').classList.add('on');
    $('mt').style.color='#4ade80';
    $('mt').textContent='ВЫБЕРИ КЛАСС';
    $('ms').innerHTML='';

    const cs=document.getElementById('cs');
    cs.innerHTML=Object.entries(CLASSES).map(([k,c])=>`
        <div class="class-btn" onclick="selectClass('${k}')">
            <div class="name">${c.emoji} ${c.name}</div>
            <div class="desc">${c.desc}</div>
            <div style="font-size:11px; margin-top:8px; color:#888;">
                HP: ${c.hp} | ATK: ${c.atk} | DEF: ${c.def}
            </div>
        </div>
    `).join('');
    document.getElementById('btn-play').style.display='block';
}

function selectClass(cls){
    G={selectedClass:cls};
    document.querySelectorAll('.class-btn').forEach(b=>b.style.borderColor='#333');
    event.target.closest('.class-btn').style.borderColor='#4ade80';
}

// ════════════════════════════════════════════════════════════════════════════
// INPUT & INIT
// ════════════════════════════════════════════════════════════════════════════

document.addEventListener('keydown', e=>{
    if(!G || !G.p || G.p.over) return;
    const dir={
        ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
        w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],
        W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]
    };
    if(dir[e.key]){ e.preventDefault(); move(...dir[e.key]); }
    else if(e.key==='.'){ tick(); }
    else if(e.key>='1'&&e.key<='5'){ useItem(+e.key-1); }
});

canvas=document.getElementById('c');
ctx=canvas.getContext('2d');
G={};
document.getElementById('info').textContent='Нажми ниже чтобы начать новую игру → ↓';

newGame();
</script>
