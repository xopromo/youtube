<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колода Силы — Карточный рогалик</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            text-align: center;
            color: #ff6b6b;
            font-size: 32px;
            margin-bottom: 12px;
            text-shadow: 0 0 20px #ff6b6b88;
            letter-spacing: 4px;
        }

        .info { text-align: center; color: #666; font-size: 12px; margin-bottom: 16px; }

        .battle-screen {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
        }

        .enemy-side, .player-side { flex: 1; }

        .panel {
            background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
            border: 2px solid #333;
            border-top: 1px solid #444;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .panel h3 {
            color: #ff6b6b;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .enemy-display {
            text-align: center;
            padding: 30px;
            background: #0a0a0a;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .enemy-emoji { font-size: 80px; margin-bottom: 15px; }
        .enemy-name { font-size: 18px; color: #ff6b6b; margin-bottom: 10px; }

        .health-bar {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            align-items: center;
        }

        .bar {
            flex: 1;
            height: 24px;
            background: #222;
            border: 1px solid #444;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #2ecc71);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #000;
        }

        .bar-fill.low { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        .bar-fill.critical { background: linear-gradient(90deg, #ff6b6b, #ef4444); }

        .intent {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
            color: #fbbf24;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #4ade80;
            font-size: 20px;
            font-weight: bold;
        }

        .hand {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            min-height: 160px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .card {
            width: 110px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1e);
            border: 2px solid #4ade80;
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        .card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .card.disabled:hover {
            transform: none;
            border-color: #4ade80;
            box-shadow: none;
        }

        .card-cost {
            background: #ff6b6b;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 12px;
        }

        .card-icon { font-size: 32px; margin: 8px 0; }
        .card-name { font-size: 11px; color: #e0e0e0; margin-bottom: 6px; font-weight: bold; }
        .card-desc { font-size: 10px; color: #888; }

        .energy-display {
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
            padding: 10px;
            background: #0a0a0a;
            border-radius: 4px;
        }

        .energy-bar {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin-top: 8px;
        }

        .energy-orb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4ade80;
            border: 1px solid #22c55e;
        }

        .energy-orb.empty {
            background: #222;
            border-color: #333;
        }

        .action-button {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff6b6b, #ff8c42);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 12px;
            transition: all 0.3s;
        }

        .action-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .log-msg {
            padding: 4px 0;
            font-size: 12px;
            line-height: 1.5;
            color: #888;
        }

        .log-msg.important { color: #ff6b6b; font-weight: bold; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.95);
            justify-content: center;
            align-items: center;
            z-index: 99;
        }

        .modal.on { display: flex; }

        .modal-content {
            background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
            border: 2px solid #ff6b6b;
            padding: 40px;
            text-align: center;
            border-radius: 6px;
            max-width: 600px;
        }

        .modal-content h2 {
            font-size: 32px;
            color: #4ade80;
            margin-bottom: 20px;
        }

        .rewards {
            display: flex;
            gap: 16px;
            margin: 30px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .reward-card {
            width: 140px;
            background: #0a0a0a;
            border: 2px solid #4ade80;
            border-radius: 6px;
            padding: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .reward-card:hover {
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        .reward-icon { font-size: 48px; margin-bottom: 10px; }
        .reward-name { font-size: 13px; color: #e0e0e0; margin-bottom: 6px; font-weight: bold; }
        .reward-desc { font-size: 11px; color: #888; }

        .stat-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 20px 0;
        }

        .stat-summary-box {
            background: #0a0a0a;
            padding: 16px;
            border-radius: 4px;
        }

        .stat-summary-label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .stat-summary-value {
            color: #4ade80;
            font-size: 24px;
            font-weight: bold;
        }

        button.btn-start {
            padding: 12px 32px;
            background: linear-gradient(135deg, #ff6b6b, #ff8c42);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
        }

        button.btn-start:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div class="container">
    <h1>🃏 КОЛОДА СИЛЫ 🃏</h1>
    <div class="info">Карточный рогалик | Этаж: <span id="floor-display">1</span>/3</div>

    <!-- BATTLE SCREEN -->
    <div id="battle-screen">
        <div class="battle-screen">
            <!-- Enemy -->
            <div class="enemy-side">
                <div class="enemy-display">
                    <div class="enemy-emoji" id="enemy-emoji"></div>
                    <div class="enemy-name" id="enemy-name"></div>
                    <div class="health-bar">
                        <div class="bar">
                            <div class="bar-fill" id="enemy-health-bar"></div>
                        </div>
                        <div style="min-width: 50px; text-align: center;">
                            <span id="enemy-hp">0</span> / <span id="enemy-maxhp">0</span>
                        </div>
                    </div>
                    <div class="intent" id="enemy-intent"></div>
                </div>

                <div class="panel">
                    <h3>📜 Журнал боя</h3>
                    <div id="log" style="height: 150px; overflow-y: auto; font-size: 12px;">
                    </div>
                </div>
            </div>

            <!-- Player -->
            <div class="player-side">
                <div class="panel">
                    <h3>⚔ Твоя статистика</h3>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-label">HP</div>
                            <div style="color: #4ade80; font-size: 18px; font-weight: bold;">
                                <span id="player-hp">0</span> / <span id="player-maxhp">0</span>
                            </div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Защита</div>
                            <div style="color: #4fc3f7; font-size: 18px; font-weight: bold;">
                                <span id="player-block">0</span>
                            </div>
                        </div>
                    </div>
                    <div class="health-bar">
                        <div class="bar">
                            <div class="bar-fill" id="player-health-bar"></div>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="energy-display">
                        ⚡ Энергия: <span id="energy">3</span> / 3
                        <div class="energy-bar" id="energy-bar"></div>
                    </div>
                    <button class="action-button" id="end-turn-btn" onclick="endTurn()">Закончить ход</button>
                </div>

                <div class="panel">
                    <h3>🎴 Рука</h3>
                    <div class="hand" id="hand"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- REWARD MODAL -->
    <div class="modal" id="reward-modal">
        <div class="modal-content">
            <h2>🎉 Победа!</h2>
            <p>Выбери карту для добавления в колоду</p>
            <div class="rewards" id="reward-cards"></div>
            <button class="btn-start" onclick="nextBattle()">Далее</button>
        </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div class="modal" id="gameover-modal">
        <div class="modal-content">
            <h2 id="gameover-title"></h2>
            <div class="stat-summary">
                <div class="stat-summary-box">
                    <div class="stat-summary-label">Врагов побеждено</div>
                    <div class="stat-summary-value" id="stat-kills">0</div>
                </div>
                <div class="stat-summary-box">
                    <div class="stat-summary-label">Карт собрано</div>
                    <div class="stat-summary-value" id="stat-cards">0</div>
                </div>
                <div class="stat-summary-box">
                    <div class="stat-summary-label">Размер колоды</div>
                    <div class="stat-summary-value" id="stat-decksize">0</div>
                </div>
                <div class="stat-summary-box">
                    <div class="stat-summary-label">Этаж достигнут</div>
                    <div class="stat-summary-value" id="stat-floor">0</div>
                </div>
            </div>
            <button class="btn-start" onclick="location.reload()">Играть снова</button>
        </div>
    </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// КАРТЫ
// ════════════════════════════════════════════════════════════════════════════

const CARD_DEFS = {
    // Атака
    strike: { name: 'Удар', icon: '⚔', cost: 1, type: 'attack', dmg: 6, desc: 'Наноси 6 урона' },
    heavy_strike: { name: 'Мощный удар', icon: '💥', cost: 2, type: 'attack', dmg: 13, desc: 'Наноси 13 урона' },
    pummel: { name: 'Комбо', icon: '👊', cost: 1, type: 'attack', dmg: 4, multi: 2, desc: 'Удари 2 раза по 4 урона' },

    // Защита
    defend: { name: 'Защита', icon: '🛡', cost: 1, type: 'skill', block: 5, desc: '+5 защиты' },
    iron_skin: { name: 'Железная кожа', icon: '🪨', cost: 1, type: 'skill', block: 7, desc: '+7 защиты' },
    brace: { name: 'Стойка', icon: '🔒', cost: 0, type: 'skill', block: 3, desc: '+3 защиты (бесплатная)' },

    // Мощные
    fireball: { name: 'Огненный шар', icon: '🔥', cost: 2, type: 'power', dmg: 10, desc: 'Урон по области' },
    double_strike: { name: 'Двойной удар', icon: '⚡', cost: 1, type: 'attack', dmg: 3, multi: 2, desc: '2x3 урона' },
    shockwave: { name: 'Волна', icon: '〰', cost: 3, type: 'power', dmg: 15, desc: 'Мощный удар (15 урона)' },

    // Комбо
    reinforce: { name: 'Усиление', icon: '💪', cost: 1, type: 'skill', block: 4, next_dmg_plus: 3, desc: '+4 защиты, след атака +3' },
};

const ENEMIES = {
    goblin: { name: 'Гоблин', emoji: '👹', hp: 12, dmg: 2, actions: ['attack', 'attack', 'defend'], floor: 1 },
    bat: { name: 'Летучая мышь', emoji: '🦇', hp: 8, dmg: 1, actions: ['attack', 'attack', 'attack'], floor: 1 },
    skeleton: { name: 'Скелет', emoji: '💀', hp: 16, dmg: 3, actions: ['attack', 'attack', 'defend'], floor: 1 },
    orc: { name: 'Орк', emoji: '🗡', hp: 22, dmg: 4, actions: ['heavy_attack', 'defend', 'attack'], floor: 2 },
    zombie: { name: 'Зомби', emoji: '🧟', hp: 20, dmg: 3, actions: ['attack', 'attack', 'defend'], floor: 2 },
    troll: { name: 'Тролль', emoji: '👹', hp: 28, dmg: 5, actions: ['heavy_attack', 'heavy_attack', 'defend'], floor: 2 },
    wyvern: { name: 'Виверна', emoji: '🐉', hp: 32, dmg: 6, actions: ['attack', 'heavy_attack', 'defend'], floor: 2 },
    demon: { name: 'Демон', emoji: '😈', hp: 45, dmg: 7, actions: ['heavy_attack', 'attack', 'defend'], floor: 3, isBoss: true },
    dragon: { name: 'Дракон', emoji: '🐲', hp: 60, dmg: 8, actions: ['heavy_attack', 'heavy_attack', 'defend'], floor: 3, isBoss: true },
};

// ════════════════════════════════════════════════════════════════════════════
// СОСТОЯНИЕ ИГРЫ
// ════════════════════════════════════════════════════════════════════════════

let game = {
    hp: 50,
    maxHp: 50,
    block: 0,
    deck: [],
    hand: [],
    discardPile: [],
    energy: 3,
    maxEnergy: 3,

    battleNum: 0,
    currentEnemy: null,
    turn: 0,
    log: [],

    killCount: 0,
    cardsCollected: 0,
    floor: 1,
};

// ════════════════════════════════════════════════════════════════════════════
// ИНИЦИАЛИЗАЦИЯ
// ════════════════════════════════════════════════════════════════════════════

function init() {
    game.deck = [
        { ...CARD_DEFS.strike },
        { ...CARD_DEFS.strike },
        { ...CARD_DEFS.defend },
        { ...CARD_DEFS.defend },
        { ...CARD_DEFS.brace },
    ];
    game.hp = 50;
    game.maxHp = 50;
    startNewBattle();
}

function startNewBattle() {
    game.turn = 0;
    game.block = 0;
    game.log = [];
    game.battleNum++;

    // Выбор врага
    const floorEnemies = Object.values(ENEMIES).filter(e => e.floor <= game.floor);
    let enemy;
    if (game.battleNum === 1) {
        enemy = ENEMIES.goblin;
    } else if (game.battleNum % 3 === 0 && game.floor >= 2) {
        // Боссы через 3 боя
        const bosses = floorEnemies.filter(e => e.isBoss);
        enemy = bosses[Math.floor(Math.random() * bosses.length)] || floorEnemies[floorEnemies.length - 1];
    } else {
        enemy = floorEnemies[Math.floor(Math.random() * floorEnemies.length)];
    }

    game.currentEnemy = {
        ...enemy,
        hp: enemy.hp,
        block: 0,
        actionIndex: 0,
    };

    game.discardPile = [];
    drawCards(5);
    addLog(`Встреча с ${game.currentEnemy.emoji} ${game.currentEnemy.name}!`);
    updateDisplay();
}

function drawCards(num) {
    for (let i = 0; i < num; i++) {
        if (game.deck.length === 0) {
            game.deck = [...game.discardPile];
            game.discardPile = [];
            if (game.deck.length === 0) break;
        }
        const idx = Math.floor(Math.random() * game.deck.length);
        game.hand.push(game.deck.splice(idx, 1)[0]);
    }
}

// ════════════════════════════════════════════════════════════════════════════
// ИГРОВАЯ ЛОГИКА
// ════════════════════════════════════════════════════════════════════════════

function playCard(index) {
    if (index >= game.hand.length) return;
    const card = game.hand[index];
    if (game.energy < card.cost) return;

    game.energy -= card.cost;
    game.hand.splice(index, 1);
    game.discardPile.push(card);

    if (card.type === 'attack' || card.type === 'power') {
        const dmg = card.dmg;
        if (card.multi) {
            for (let i = 0; i < card.multi; i++) {
                game.currentEnemy.hp -= dmg;
            }
            addLog(`${card.icon} ${card.name}: ${dmg} x${card.multi} = ${dmg * card.multi} урона`);
        } else {
            game.currentEnemy.hp -= dmg;
            addLog(`${card.icon} ${card.name}: ${dmg} урона`);
        }
    } else if (card.type === 'skill') {
        game.block += card.block;
        addLog(`${card.icon} ${card.name}: +${card.block} защиты`);
    }

    updateDisplay();
}

function endTurn() {
    game.turn++;
    addLog(`--- Ход ${game.turn} врага ---`);

    const action = game.currentEnemy.actions[game.currentEnemy.actionIndex % game.currentEnemy.actions.length];
    game.currentEnemy.actionIndex++;

    if (action === 'attack') {
        const dmg = Math.max(1, game.currentEnemy.dmg - Math.floor(game.block / 2));
        game.hp -= dmg;
        addLog(`${game.currentEnemy.emoji} атакует: ${dmg} урона (защита: ${game.block})`, true);
        game.block = 0;
    } else if (action === 'heavy_attack') {
        const dmg = Math.max(1, Math.floor(game.currentEnemy.dmg * 2) - Math.floor(game.block / 2));
        game.hp -= dmg;
        addLog(`${game.currentEnemy.emoji} МОЩНАЯ АТАКА: ${dmg} урона!`, true);
        game.block = 0;
    } else if (action === 'defend') {
        game.currentEnemy.block += 8;
        addLog(`${game.currentEnemy.emoji} готовится к защите: +8 защиты`);
    }

    if (game.currentEnemy.hp <= 0) {
        win();
        return;
    }

    if (game.hp <= 0) {
        lose();
        return;
    }

    game.energy = game.maxEnergy;
    drawCards(5);
    addLog('Новая рука');
    updateDisplay();
}

function win() {
    game.killCount++;
    game.cardsCollected++;
    addLog(`${game.currentEnemy.emoji} ${game.currentEnemy.name} побежден!`, true);

    document.getElementById('reward-modal').classList.add('on');
    const rewards = document.getElementById('reward-cards');
    rewards.innerHTML = '';

    // Гарантировать хороший выбор карт
    const cardKeys = Object.keys(CARD_DEFS);
    const selected = [];

    for (let i = 0; i < 3; i++) {
        let key;
        do {
            key = cardKeys[Math.floor(Math.random() * cardKeys.length)];
        } while (selected.includes(key));
        selected.push(key);
    }

    selected.forEach(key => {
        const card = CARD_DEFS[key];
        rewards.innerHTML += `
            <div class="reward-card" onclick="addCardToDeck('${key}')">
                <div class="reward-icon">${card.icon}</div>
                <div class="reward-name">${card.name}</div>
                <div class="reward-desc">Стоимость: ${card.cost}</div>
            </div>
        `;
    });
}

function addCardToDeck(cardKey) {
    game.deck.push({ ...CARD_DEFS[cardKey] });
    document.getElementById('reward-modal').classList.remove('on');
    nextBattle();
}

function nextBattle() {
    game.floor = Math.floor((game.battleNum / 3) + 1);

    if (game.battleNum >= 9) {
        endGame(true);
    } else {
        startNewBattle();
    }
}

function lose() {
    addLog('Ты был побежден!', true);
    setTimeout(() => {
        document.getElementById('battle-screen').style.display = 'none';
        endGame(false);
    }, 1000);
}

function endGame(won) {
    const modal = document.getElementById('gameover-modal');
    const title = document.getElementById('gameover-title');
    title.textContent = won ? '🎉 ПОБЕДА!' : '💀 ПОРАЖЕНИЕ';
    title.style.color = won ? '#4ade80' : '#ff6b6b';

    document.getElementById('stat-kills').textContent = game.killCount;
    document.getElementById('stat-cards').textContent = game.cardsCollected;
    document.getElementById('stat-decksize').textContent = game.deck.length + game.discardPile.length;
    document.getElementById('stat-floor').textContent = game.floor;

    modal.classList.add('on');
}

function addLog(msg, important = false) {
    const log = document.getElementById('log');
    const div = document.createElement('div');
    div.className = 'log-msg' + (important ? ' important' : '');
    div.textContent = msg;
    log.insertBefore(div, log.firstChild);
    if (log.children.length > 20) log.removeChild(log.lastChild);
}

// ════════════════════════════════════════════════════════════════════════════
// ОТОБРАЖЕНИЕ
// ════════════════════════════════════════════════════════════════════════════

function updateDisplay() {
    document.getElementById('floor-display').textContent = game.floor;

    // Враг
    const enemy = game.currentEnemy;
    const enemyMaxHp = Object.values(ENEMIES).find(e => e.emoji === enemy.emoji)?.hp || 50;
    const enemyHpPct = Math.max(0, enemy.hp / enemyMaxHp);
    document.getElementById('enemy-emoji').textContent = enemy.emoji;
    document.getElementById('enemy-name').textContent = enemy.name + (enemy.isBoss ? ' 👑 БОСС' : '');
    document.getElementById('enemy-hp').textContent = Math.max(0, enemy.hp);
    document.getElementById('enemy-maxhp').textContent = enemyMaxHp;
    const enemyBar = document.getElementById('enemy-health-bar');
    enemyBar.style.width = (enemyHpPct * 100) + '%';
    enemyBar.className = 'bar-fill ' + (enemyHpPct > 0.5 ? '' : enemyHpPct > 0.25 ? 'low' : 'critical');
    enemyBar.textContent = Math.max(0, Math.ceil(enemy.hp));

    const actionName = { attack: '⚔ Атака', heavy_attack: '💥 МОЩНАЯ АТАКА', defend: '🛡 Защита' };
    const nextAction = enemy.actions[enemy.actionIndex % enemy.actions.length];
    document.getElementById('enemy-intent').textContent = actionName[nextAction] || nextAction;

    // Игрок
    const playerHpPct = game.hp / game.maxHp;
    document.getElementById('player-hp').textContent = Math.max(0, game.hp);
    document.getElementById('player-maxhp').textContent = game.maxHp;
    document.getElementById('player-block').textContent = game.block;
    const playerBar = document.getElementById('player-health-bar');
    playerBar.style.width = (playerHpPct * 100) + '%';
    playerBar.className = 'bar-fill ' + (playerHpPct > 0.5 ? '' : playerHpPct > 0.25 ? 'low' : 'critical');
    playerBar.textContent = Math.max(0, Math.ceil(game.hp));

    // Энергия
    document.getElementById('energy').textContent = game.energy;
    const energyBar = document.getElementById('energy-bar');
    energyBar.innerHTML = '';
    for (let i = 0; i < game.maxEnergy; i++) {
        const orb = document.createElement('div');
        orb.className = 'energy-orb' + (i >= game.energy ? ' empty' : '');
        energyBar.appendChild(orb);
    }

    // Карты в руке
    const hand = document.getElementById('hand');
    hand.innerHTML = '';
    game.hand.forEach((card, i) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card' + (game.energy < card.cost ? ' disabled' : '');
        cardEl.onclick = () => playCard(i);
        cardEl.innerHTML = `
            <div class="card-cost">${card.cost}</div>
            <div class="card-icon">${card.icon}</div>
            <div class="card-name">${card.name}</div>
            <div class="card-desc">${card.desc}</div>
        `;
        hand.appendChild(cardEl);
    });
}

init();
</script>
