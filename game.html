<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slay the Spire-like Roguelike</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            text-align: center;
            color: #ff6b6b;
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff6b6b88;
            letter-spacing: 4px;
        }

        .battle-screen {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
        }

        .enemy-side, .player-side {
            flex: 1;
        }

        .panel {
            background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
            border: 2px solid #333;
            border-top: 1px solid #444;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .panel h3 {
            color: #ff6b6b;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .enemy-display {
            text-align: center;
            padding: 30px;
            background: #0a0a0a;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .enemy-emoji {
            font-size: 80px;
            margin-bottom: 15px;
        }

        .enemy-name {
            font-size: 18px;
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        .health-bar {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            align-items: center;
        }

        .bar {
            flex: 1;
            height: 24px;
            background: #222;
            border: 1px solid #444;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #2ecc71);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #000;
        }

        .bar-fill.low {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
        }

        .bar-fill.critical {
            background: linear-gradient(90deg, #ff6b6b, #ef4444);
        }

        .intent {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
        }

        .intent .icon {
            font-size: 24px;
            margin-right: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #4ade80;
            font-size: 20px;
            font-weight: bold;
        }

        .hand {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            min-height: 180px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .card {
            width: 120px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1e);
            border: 2px solid #4ade80;
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        .card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .card.disabled:hover {
            transform: none;
            border-color: #4ade80;
            box-shadow: none;
        }

        .card-cost {
            background: #ff6b6b;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 12px;
        }

        .card-icon {
            font-size: 32px;
            margin: 8px 0;
        }

        .card-name {
            font-size: 12px;
            color: #e0e0e0;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .card-desc {
            font-size: 11px;
            color: #888;
        }

        .energy-display {
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
            padding: 10px;
            background: #0a0a0a;
            border-radius: 4px;
        }

        .energy-bar {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin-top: 8px;
        }

        .energy-orb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4ade80;
            border: 1px solid #22c55e;
        }

        .energy-orb.empty {
            background: #222;
            border-color: #333;
        }

        .action-button {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff6b6b, #ff8c42);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 12px;
            transition: all 0.3s;
        }

        .action-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.95);
            justify-content: center;
            align-items: center;
            z-index: 99;
        }

        .modal.on {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
            border: 2px solid #ff6b6b;
            padding: 40px;
            text-align: center;
            border-radius: 6px;
            max-width: 600px;
        }

        .modal-content h2 {
            font-size: 32px;
            color: #4ade80;
            margin-bottom: 20px;
        }

        .modal-content p {
            font-size: 16px;
            color: #888;
            margin-bottom: 12px;
        }

        .rewards {
            display: flex;
            gap: 16px;
            margin: 30px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .reward-card {
            width: 140px;
            background: #0a0a0a;
            border: 2px solid #4ade80;
            border-radius: 6px;
            padding: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .reward-card:hover {
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        .reward-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .reward-name {
            font-size: 13px;
            color: #e0e0e0;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .reward-desc {
            font-size: 11px;
            color: #888;
        }

        .log-msg {
            padding: 4px 0;
            font-size: 13px;
            line-height: 1.6;
            color: #888;
        }

        .log-msg.important {
            color: #ff6b6b;
            font-weight: bold;
        }

        .game-over-modal {
            text-align: center;
        }

        .game-over-modal h2 {
            font-size: 48px !important;
            margin-bottom: 30px !important;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 20px 0;
        }

        .stat-summary-box {
            background: #0a0a0a;
            padding: 16px;
            border-radius: 4px;
        }

        .stat-summary-label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .stat-summary-value {
            color: #4ade80;
            font-size: 24px;
            font-weight: bold;
        }

        button.btn-start {
            padding: 12px 32px;
            background: linear-gradient(135deg, #ff6b6b, #ff8c42);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
        }

        button.btn-start:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🃏 CARD SPIRE 🃏</h1>

    <!-- BATTLE SCREEN -->
    <div id="battle-screen">
        <div class="battle-screen">
            <!-- Enemy -->
            <div class="enemy-side">
                <div class="enemy-display">
                    <div class="enemy-emoji" id="enemy-emoji"></div>
                    <div class="enemy-name" id="enemy-name"></div>
                    <div class="health-bar">
                        <div class="bar">
                            <div class="bar-fill" id="enemy-health-bar"></div>
                        </div>
                        <div style="min-width: 50px; text-align: center;">
                            <span id="enemy-hp">0</span> / <span id="enemy-maxhp">0</span>
                        </div>
                    </div>
                    <div class="intent" id="enemy-intent"></div>
                </div>

                <div class="panel">
                    <h3>Battle Log</h3>
                    <div id="log" style="height: 150px; overflow-y: auto; font-size: 12px;">
                    </div>
                </div>
            </div>

            <!-- Player -->
            <div class="player-side">
                <div class="panel">
                    <h3>Your Stats</h3>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-label">HP</div>
                            <div style="color: #4ade80; font-size: 18px; font-weight: bold;">
                                <span id="player-hp">0</span> / <span id="player-maxhp">0</span>
                            </div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Block</div>
                            <div style="color: #4fc3f7; font-size: 18px; font-weight: bold;">
                                <span id="player-block">0</span>
                            </div>
                        </div>
                    </div>
                    <div class="health-bar">
                        <div class="bar">
                            <div class="bar-fill" id="player-health-bar"></div>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="energy-display">
                        Energy: <span id="energy">3</span> / 3
                        <div class="energy-bar" id="energy-bar"></div>
                    </div>
                    <button class="action-button" id="end-turn-btn" onclick="endTurn()">End Turn</button>
                </div>

                <div class="panel">
                    <h3>Hand</h3>
                    <div class="hand" id="hand"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- REWARD MODAL -->
    <div class="modal" id="reward-modal">
        <div class="modal-content">
            <h2>Victory!</h2>
            <p>Choose a card to add to your deck</p>
            <div class="rewards" id="reward-cards"></div>
            <button class="btn-start" onclick="nextBattle()">Continue</button>
        </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div class="modal" id="gameover-modal">
        <div class="modal-content game-over-modal">
            <h2 id="gameover-title"></h2>
            <div class="stats-summary">
                <div class="stat-summary-box">
                    <div class="stat-summary-label">Enemies Defeated</div>
                    <div class="stat-summary-value" id="stat-kills">0</div>
                </div>
                <div class="stat-summary-box">
                    <div class="stat-summary-label">Cards Collected</div>
                    <div class="stat-summary-value" id="stat-cards">0</div>
                </div>
                <div class="stat-summary-box">
                    <div class="stat-summary-label">Deck Size</div>
                    <div class="stat-summary-value" id="stat-decksize">0</div>
                </div>
                <div class="stat-summary-box">
                    <div class="stat-summary-label">Floor Reached</div>
                    <div class="stat-summary-value" id="stat-floor">0</div>
                </div>
            </div>
            <button class="btn-start" onclick="location.reload()">Play Again</button>
        </div>
    </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// CARD DEFINITIONS
// ════════════════════════════════════════════════════════════════════════════

const CARD_DEFS = {
    strike: { name: 'Strike', icon: '⚔', cost: 1, type: 'attack', effect: { dmg: 6 } },
    heavy_strike: { name: 'Heavy Strike', icon: '💥', cost: 2, type: 'attack', effect: { dmg: 13 } },
    pummel: { name: 'Pummel', icon: '👊', cost: 1, type: 'attack', effect: { dmg: 4, hits: 2 } },

    defend: { name: 'Defend', icon: '🛡', cost: 1, type: 'skill', effect: { block: 5 } },
    iron_skin: { name: 'Iron Skin', icon: '🪨', cost: 1, type: 'skill', effect: { block: 7 } },
    brace: { name: 'Brace', icon: '🔒', cost: 0, type: 'skill', effect: { block: 3 } },

    fireball: { name: 'Fireball', icon: '🔥', cost: 2, type: 'power', effect: { dmg: 10, aoe: true } },
    flame_strike: { name: 'Flame Strike', icon: '🔥', cost: 3, type: 'power', effect: { dmg: 15 } },

    weakened: { name: 'Weakened', icon: '😵', cost: -1, type: 'curse', effect: { debuff: true } },
};

const ENEMIES = {
    goblin: { name: 'Goblin', emoji: '👹', hp: 12, dmg: 2, actions: ['attack', 'attack', 'defend'] },
    skeleton: { name: 'Skeleton', emoji: '💀', hp: 16, dmg: 3, actions: ['attack', 'attack', 'defend'] },
    orc: { name: 'Orc', emoji: '🗡', hp: 22, dmg: 4, actions: ['heavy_attack', 'defend', 'attack'] },
    dragon: { name: 'Dragon', emoji: '🐉', hp: 50, dmg: 6, actions: ['attack', 'heavy_attack', 'attack'], isBoss: true },
};

// ════════════════════════════════════════════════════════════════════════════
// GAME STATE
// ════════════════════════════════════════════════════════════════════════════

let game = {
    // Player state
    hp: 40,
    maxHp: 40,
    block: 0,
    deck: [],
    hand: [],
    discardPile: [],
    energy: 3,
    maxEnergy: 3,

    // Battle state
    battleNum: 0,
    currentEnemy: null,
    enemyIndex: 0,
    turn: 0,
    log: [],

    // Progression
    killCount: 0,
    cardsCollected: 0,
    floor: 1,
};

// ════════════════════════════════════════════════════════════════════════════
// INITIALIZATION
// ════════════════════════════════════════════════════════════════════════════

function init() {
    game.deck = [
        { ...CARD_DEFS.strike },
        { ...CARD_DEFS.strike },
        { ...CARD_DEFS.defend },
        { ...CARD_DEFS.defend },
        { ...CARD_DEFS.defend },
    ];
    game.hp = 40;
    game.maxHp = 40;
    startNewBattle();
}

function startNewBattle() {
    game.turn = 0;
    game.block = 0;
    game.log = [];
    game.battleNum++;

    // Spawn enemy
    const enemies = Object.values(ENEMIES);
    game.currentEnemy = {
        ...enemies[Math.min(game.battleNum - 1, enemies.length - 1)],
        hp: enemies[Math.min(game.battleNum - 1, enemies.length - 1)].hp,
        block: 0,
        actionIndex: 0,
    };

    // Draw hand
    game.discardPile = [];
    drawCards(5);
    addLog('Battle started!');
    updateDisplay();
}

function drawCards(num) {
    for (let i = 0; i < num; i++) {
        if (game.deck.length === 0) {
            game.deck = [...game.discardPile];
            game.discardPile = [];
            if (game.deck.length === 0) break;
        }
        const idx = Math.floor(Math.random() * game.deck.length);
        game.hand.push(game.deck.splice(idx, 1)[0]);
    }
}

// ════════════════════════════════════════════════════════════════════════════
// CARD PLAYING
// ════════════════════════════════════════════════════════════════════════════

function playCard(index) {
    if (index >= game.hand.length) return;
    const card = game.hand[index];
    if (game.energy < card.cost) return;

    game.energy -= card.cost;
    game.hand.splice(index, 1);
    game.discardPile.push(card);

    // Apply effect
    if (card.type === 'attack' || card.type === 'power') {
        const dmg = card.effect.dmg;
        game.currentEnemy.hp -= dmg;
        addLog(`You play ${card.icon} ${card.name}: ${dmg} damage`);
    } else if (card.type === 'skill') {
        game.block += card.effect.block;
        addLog(`You play ${card.icon} ${card.name}: +${card.effect.block} Block`);
    }

    updateDisplay();
}

// ════════════════════════════════════════════════════════════════════════════
// TURN MANAGEMENT
// ════════════════════════════════════════════════════════════════════════════

function endTurn() {
    game.turn++;
    addLog(`--- End Turn ${game.turn} ---`);

    // Enemy action
    const action = game.currentEnemy.actions[game.currentEnemy.actionIndex % game.currentEnemy.actions.length];
    game.currentEnemy.actionIndex++;

    if (action === 'attack') {
        const dmg = Math.max(1, game.currentEnemy.dmg - Math.floor(game.block / 2));
        game.hp -= dmg;
        addLog(`${game.currentEnemy.emoji} attacks: ${dmg} damage (block: ${game.block})`);
        game.block = 0;
    } else if (action === 'heavy_attack') {
        const dmg = Math.max(1, game.currentEnemy.dmg * 2 - Math.floor(game.block / 2));
        game.hp -= dmg;
        addLog(`${game.currentEnemy.emoji} heavy attack: ${dmg} damage!`);
        game.block = 0;
    } else if (action === 'defend') {
        game.currentEnemy.block += 8;
        addLog(`${game.currentEnemy.emoji} braces: +8 block`);
    }

    // Check win/lose
    if (game.currentEnemy.hp <= 0) {
        win();
        return;
    }

    if (game.hp <= 0) {
        lose();
        return;
    }

    // Draw cards
    game.energy = game.maxEnergy;
    drawCards(5);
    addLog('New hand drawn');
    updateDisplay();
}

// ════════════════════════════════════════════════════════════════════════════
// BATTLE OUTCOME
// ════════════════════════════════════════════════════════════════════════════

function win() {
    game.killCount++;
    game.cardsCollected++;
    addLog(`${game.currentEnemy.emoji} defeated!`);

    // Show reward
    document.getElementById('reward-modal').classList.add('on');
    const rewards = document.getElementById('reward-cards');
    rewards.innerHTML = '';

    // Generate 3 random cards
    const cardKeys = Object.keys(CARD_DEFS).filter(k => !k.includes('weakened'));
    for (let i = 0; i < 3; i++) {
        const key = cardKeys[Math.floor(Math.random() * cardKeys.length)];
        const card = CARD_DEFS[key];
        rewards.innerHTML += `
            <div class="reward-card" onclick="addCardToDeck('${key}')">
                <div class="reward-icon">${card.icon}</div>
                <div class="reward-name">${card.name}</div>
                <div class="reward-desc">Cost: ${card.cost}</div>
            </div>
        `;
    }
}

function addCardToDeck(cardKey) {
    game.deck.push({ ...CARD_DEFS[cardKey] });
    document.getElementById('reward-modal').classList.remove('on');
    nextBattle();
}

function nextBattle() {
    if (game.battleNum >= 6) {
        endGame(true);
    } else {
        game.floor = Math.floor(game.battleNum / 3) + 1;
        startNewBattle();
    }
}

function lose() {
    addLog('You were defeated!');
    setTimeout(() => {
        document.getElementById('battle-screen').style.display = 'none';
        endGame(false);
    }, 1000);
}

function endGame(won) {
    const modal = document.getElementById('gameover-modal');
    const title = document.getElementById('gameover-title');
    title.textContent = won ? '🎉 VICTORY!' : '💀 DEFEAT';
    title.style.color = won ? '#4ade80' : '#ff6b6b';

    document.getElementById('stat-kills').textContent = game.killCount;
    document.getElementById('stat-cards').textContent = game.cardsCollected;
    document.getElementById('stat-decksize').textContent = game.deck.length + game.discardPile.length;
    document.getElementById('stat-floor').textContent = game.floor;

    modal.classList.add('on');
}

// ════════════════════════════════════════════════════════════════════════════
// DISPLAY UPDATE
// ════════════════════════════════════════════════════════════════════════════

function updateDisplay() {
    // Enemy
    const enemy = game.currentEnemy;
    const enemyHpPct = Math.max(0, enemy.hp / 50);
    document.getElementById('enemy-emoji').textContent = enemy.emoji;
    document.getElementById('enemy-name').textContent = enemy.name;
    document.getElementById('enemy-hp').textContent = Math.max(0, enemy.hp);
    document.getElementById('enemy-maxhp').textContent = enemy.hp > 0 ? 50 : 0;
    const enemyBar = document.getElementById('enemy-health-bar');
    enemyBar.style.width = (enemyHpPct * 100) + '%';
    enemyBar.className = 'bar-fill ' + (enemyHpPct > 0.5 ? '' : enemyHpPct > 0.25 ? 'low' : 'critical');
    enemyBar.textContent = Math.max(0, Math.ceil(enemy.hp));

    // Enemy intent
    const nextAction = enemy.actions[enemy.actionIndex % enemy.actions.length];
    let intentText = '';
    if (nextAction === 'attack') intentText = '⚔️ Attack (2)';
    else if (nextAction === 'heavy_attack') intentText = '💥 Heavy Attack (4)';
    else if (nextAction === 'defend') intentText = '🛡️ Defend (+8)';
    document.getElementById('enemy-intent').innerHTML = `<div class="icon">${intentText.split(' ')[0]}</div>${intentText.split(' ').slice(1).join(' ')}`;

    // Player
    const hpPct = game.hp / game.maxHp;
    document.getElementById('player-hp').textContent = game.hp;
    document.getElementById('player-maxhp').textContent = game.maxHp;
    document.getElementById('player-block').textContent = game.block;
    const playerBar = document.getElementById('player-health-bar');
    playerBar.style.width = (hpPct * 100) + '%';
    playerBar.className = 'bar-fill ' + (hpPct > 0.5 ? '' : hpPct > 0.25 ? 'low' : 'critical');

    // Energy
    document.getElementById('energy').textContent = game.energy;
    let energyHtml = '';
    for (let i = 0; i < game.maxEnergy; i++) {
        energyHtml += `<div class="energy-orb ${i >= game.energy ? 'empty' : ''}"></div>`;
    }
    document.getElementById('energy-bar').innerHTML = energyHtml;

    // Hand
    const handEl = document.getElementById('hand');
    handEl.innerHTML = '';
    game.hand.forEach((card, i) => {
        const canPlay = game.energy >= card.cost;
        handEl.innerHTML += `
            <div class="card ${!canPlay ? 'disabled' : ''}" ${canPlay ? `onclick="playCard(${i})"` : ''}>
                <div class="card-cost">${card.cost}</div>
                <div class="card-icon">${card.icon}</div>
                <div class="card-name">${card.name}</div>
                <div class="card-desc">${card.effect.dmg ? `${card.effect.dmg} damage` : `+${card.effect.block} block`}</div>
            </div>
        `;
    });

    // Log
    const logEl = document.getElementById('log');
    logEl.innerHTML = game.log.slice(-10).reverse().map(m =>
        `<div class="log-msg ${m.important ? 'important' : ''}">${m.text}</div>`
    ).join('');
}

function addLog(text, important = false) {
    game.log.push({ text, important });
}

// Start game
init();
</script>

</body>
</html>
