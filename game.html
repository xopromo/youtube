<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колода Силы - Карточный рогалик</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container { width: 100%; max-width: 1300px; }
        h1 {
            text-align: center;
            color: #ff6b6b;
            font-size: 32px;
            margin-bottom: 12px;
            text-shadow: 0 0 20px #ff6b6b88;
        }
        .header { display: flex; gap: 40px; justify-content: center; margin-bottom: 16px; font-size: 12px; }
        .main { display: flex; gap: 20px; }
        .battle { flex: 2; }
        .sidebar { flex: 1; }

        .battle-layout { display: flex; gap: 20px; }
        .left { flex: 1; }
        .right { flex: 1; }

        .panel {
            background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
            border: 2px solid #333;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .panel h3 {
            color: #ff6b6b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .display { text-align: center; padding: 20px; background: #0a0a0a; border-radius: 6px; }
        .emoji { font-size: 60px; margin: 10px 0; }
        .name { font-size: 16px; color: #ff6b6b; margin-bottom: 10px; font-weight: bold; }

        .bar {
            height: 20px;
            background: #222;
            border: 1px solid #444;
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
        }
        .fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #2ecc71);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #000;
        }
        .fill.yellow { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        .fill.red { background: linear-gradient(90deg, #ff6b6b, #ef4444); }

        .intent { background: #1a1a2e; border: 1px solid #333; padding: 8px; text-align: center; margin-top: 10px; font-weight: bold; color: #fbbf24; }
        .effects { display: flex; gap: 4px; margin-top: 8px; font-size: 20px; }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .stat-box {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            font-size: 12px;
        }
        .stat-label { color: #888; font-size: 10px; }
        .stat-val { color: #4ade80; font-size: 16px; font-weight: bold; }

        .hand {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 140px;
            margin-top: 10px;
        }
        .card {
            width: 100px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1e);
            border: 2px solid #4ade80;
            border-radius: 5px;
            padding: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            position: relative;
            font-size: 10px;
        }
        .card:hover { transform: translateY(-6px); border-color: #22c55e; box-shadow: 0 0 15px rgba(34, 197, 94, 0.3); }
        .card.disabled { opacity: 0.4; cursor: not-allowed; }
        .card.disabled:hover { transform: none; box-shadow: none; }
        .card-rarity { font-size: 8px; position: absolute; top: 4px; left: 4px; }
        .card-cost { position: absolute; top: 4px; right: 4px; background: #ff6b6b; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
        .card-icon { font-size: 24px; margin: 4px 0; }
        .card-name { font-weight: bold; margin: 4px 0; }
        .card-desc { font-size: 9px; color: #888; }

        .energy { text-align: center; font-size: 14px; padding: 8px; background: #0a0a0a; border-radius: 4px; margin-bottom: 10px; }
        .energy-dots { display: flex; gap: 3px; justify-content: center; margin-top: 4px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background: #4ade80; border: 1px solid #22c55e; }
        .dot.empty { background: #222; border-color: #333; }

        .btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ff8c42);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .log { height: 110px; overflow-y: auto; font-size: 11px; line-height: 1.4; }
        .msg { padding: 2px 0; color: #888; }
        .msg.imp { color: #ff6b6b; font-weight: bold; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.95);
            justify-content: center;
            align-items: center;
            z-index: 99;
        }
        .modal.on { display: flex; }
        .modal-box {
            background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
            border: 2px solid #ff6b6b;
            padding: 40px;
            border-radius: 6px;
            text-align: center;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box h2 { font-size: 28px; color: #4ade80; margin-bottom: 20px; }
        .choices {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }
        .choice {
            background: #0a0a0a;
            border: 2px solid #4ade80;
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .choice:hover { border-color: #22c55e; box-shadow: 0 0 15px rgba(34, 197, 94, 0.3); }
        .choice-icon { font-size: 36px; margin-bottom: 6px; }
        .choice-name { font-size: 11px; color: #e0e0e0; font-weight: bold; }
        .choice-desc { font-size: 9px; color: #888; margin-top: 4px; }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        .stat { background: #0a0a0a; padding: 12px; border-radius: 4px; }
        .stat-label { color: #888; font-size: 10px; }
        .stat-value { color: #4ade80; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🃏 КОЛОДА СИЛЫ 🃏</h1>
    <div class="header">
        <div>Этаж <span id="floor">1</span>/3</div>
        <div>Боёв <span id="battle">0</span>/9</div>
        <div>Золото <span id="gold">0</span>💰</div>
        <div>Колода <span id="decksize">5</span></div>
    </div>

    <div class="main">
        <div class="battle">
            <div id="battle-screen">
                <div class="battle-layout">
                    <!-- ВРАГ -->
                    <div class="left">
                        <div class="display">
                            <div class="emoji" id="emoji">👹</div>
                            <div class="name" id="ename">враг</div>
                            <div class="bar">
                                <div class="fill" id="ebar" style="width: 100%;">50/50</div>
                            </div>
                            <div class="effects" id="eeffects"></div>
                            <div class="intent" id="intent">⚔ Атака</div>
                        </div>

                        <div class="panel">
                            <h3>📜 Журнал</h3>
                            <div class="log" id="log"></div>
                        </div>
                    </div>

                    <!-- ИГРОК -->
                    <div class="right">
                        <div class="panel">
                            <h3>⚔ Твоя статистика</h3>
                            <div class="grid2">
                                <div class="stat-box">
                                    <div class="stat-label">HP</div>
                                    <div class="stat-val"><span id="hp">50</span>/<span id="mhp">50</span></div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-label">Защита</div>
                                    <div class="stat-val" id="block">0</div>
                                </div>
                            </div>
                            <div class="bar">
                                <div class="fill" id="pbar" style="width: 100%;">50</div>
                            </div>
                            <div class="effects" id="peffects"></div>
                        </div>

                        <div class="panel">
                            <div class="energy">
                                ⚡ Энергия: <span id="energy">3</span>/3
                                <div class="energy-dots" id="energy-dots">
                                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                                </div>
                            </div>
                            <button class="btn" onclick="endTurn()">Закончить ход</button>
                        </div>

                        <div class="panel">
                            <h3>🎴 Рука</h3>
                            <div class="hand" id="hand"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- САЙДБАР -->
        <div class="sidebar">
            <div class="panel">
                <h3>✨ Реликвии</h3>
                <div id="relics" style="min-height: 40px;">Нет</div>
            </div>
        </div>
    </div>
</div>

<!-- МОДАЛИ -->
<div class="modal" id="reward-modal">
    <div class="modal-box">
        <h2>🎉 Победа!</h2>
        <p>Выбери карту</p>
        <div class="choices" id="reward-choices"></div>
        <button class="btn" onclick="closReward()">Далее</button>
    </div>
</div>

<div class="modal" id="path-modal">
    <div class="modal-box">
        <h2>🛤️ Выбери путь</h2>
        <div class="choices" id="path-choices"></div>
    </div>
</div>

<div class="modal" id="gameover-modal">
    <div class="modal-box">
        <h2 id="go-title">Победа!</h2>
        <div class="stats">
            <div class="stat"><div class="stat-label">Врагов</div><div class="stat-value" id="stat-kills">0</div></div>
            <div class="stat"><div class="stat-label">Этажей</div><div class="stat-value" id="stat-floors">0</div></div>
            <div class="stat"><div class="stat-label">Реликвий</div><div class="stat-value" id="stat-relics">0</div></div>
            <div class="stat"><div class="stat-label">Золото</div><div class="stat-value" id="stat-gold">0</div></div>
        </div>
        <button class="btn" onclick="location.reload()">Играть снова</button>
    </div>
</div>

<script>
// КАРТЫ
const CARDS = {
    strike: { name: 'Удар', icon: '⚔', cost: 1, type: 'attack', dmg: 6, rarity: 'common', desc: '6 урона' },
    pummel: { name: 'Комбо', icon: '👊', cost: 1, type: 'attack', dmg: 3, hits: 2, rarity: 'common', desc: '3x2' },
    defend: { name: 'Защита', icon: '🛡', cost: 1, type: 'skill', block: 5, rarity: 'common', desc: '+5' },
    brace: { name: 'Стойка', icon: '🔒', cost: 0, type: 'skill', block: 3, rarity: 'common', desc: '+3' },
    heavy: { name: 'Мощный удар', icon: '💥', cost: 2, type: 'attack', dmg: 13, rarity: 'rare', desc: '13' },
    poison: { name: 'Ядовитый', icon: '☠', cost: 2, type: 'attack', dmg: 8, poison: 2, rarity: 'rare', desc: '8+яд' },
    iron: { name: 'Железная кожа', icon: '🪨', cost: 1, type: 'skill', block: 7, rarity: 'rare', desc: '+7' },
    fireball: { name: 'Огненный шар', icon: '🔥', cost: 2, type: 'power', dmg: 10, burn: 1, rarity: 'epic', desc: '10+огонь' },
    wave: { name: 'Волна', icon: '〰', cost: 3, type: 'power', dmg: 15, rarity: 'epic', desc: '15' },
    inferno: { name: 'Инферно', icon: '🌪', cost: 3, type: 'power', dmg: 20, burn: 3, rarity: 'legend', desc: '20+3огонь' },
};

const ENEMIES = {
    goblin: { name: 'Гоблин', emoji: '👹', hp: 12, dmg: 2, actions: ['attack','attack','defend'], floor: 1 },
    bat: { name: 'Летучая мышь', emoji: '🦇', hp: 8, dmg: 1, actions: ['attack','attack','attack'], floor: 1 },
    skeleton: { name: 'Скелет', emoji: '💀', hp: 16, dmg: 3, actions: ['attack','attack','defend'], floor: 1 },
    orc: { name: 'Орк', emoji: '🗡', hp: 22, dmg: 4, actions: ['heavy','defend','attack'], floor: 2 },
    zombie: { name: 'Зомби', emoji: '🧟', hp: 20, dmg: 3, actions: ['attack','attack','defend'], floor: 2 },
    troll: { name: 'Тролль', emoji: '👹', hp: 28, dmg: 5, actions: ['heavy','heavy','defend'], floor: 2 },
    wyvern: { name: 'Виверна', emoji: '🐉', hp: 32, dmg: 6, actions: ['attack','heavy','defend'], floor: 2 },
    demon: { name: 'Демон', emoji: '😈', hp: 45, dmg: 7, actions: ['heavy','attack','defend'], floor: 3, boss: 1 },
    dragon: { name: 'Дракон', emoji: '🐲', hp: 60, dmg: 8, actions: ['heavy','heavy','defend'], floor: 3, boss: 1 },
};

// СОСТОЯНИЕ
let game = {
    hp: 50, maxHp: 50, block: 0,
    deck: [], hand: [], discard: [],
    energy: 3, maxEnergy: 3,
    gold: 0, relics: [],
    dmg_bonus: 0, draw_per_turn: 5,
    poison: 0, burn: 0,
    battle: 0, floor: 1,
    enemy: null, kills: 0, log: [],
};

function init() {
    game.deck = [
        { ...CARDS.strike },
        { ...CARDS.strike },
        { ...CARDS.defend },
        { ...CARDS.defend },
        { ...CARDS.brace },
    ];
    game.hp = game.maxHp = 50;
    game.gold = 0;
    game.battle = 0;
    startBattle();
}

function startBattle() {
    game.battle++;
    game.floor = Math.floor((game.battle - 1) / 3) + 1;
    game.turn = 0;
    game.block = 0;
    game.poison = game.burn = 0;
    game.log = [];
    game.hand = [];

    const floorEnemies = Object.values(ENEMIES).filter(e => e.floor <= game.floor);
    let enemy;
    if (game.battle % 3 === 0 && game.floor >= 2) {
        const bosses = floorEnemies.filter(e => e.boss);
        enemy = bosses.length ? bosses[Math.floor(Math.random() * bosses.length)] : floorEnemies[floorEnemies.length - 1];
    } else {
        enemy = floorEnemies[Math.floor(Math.random() * floorEnemies.length)];
    }

    game.enemy = { ...enemy, hp: enemy.hp, block: 0, idx: 0 };
    drawCards(game.draw_per_turn);
    addLog(`💀 ${game.enemy.name}!`);
    updateDisplay();
}

function drawCards(num) {
    for (let i = 0; i < num; i++) {
        if (game.deck.length === 0) {
            game.deck = [...game.discard];
            game.discard = [];
            if (!game.deck.length) break;
        }
        const idx = Math.floor(Math.random() * game.deck.length);
        game.hand.push(game.deck.splice(idx, 1)[0]);
    }
}

function playCard(i) {
    if (i >= game.hand.length || game.energy < game.hand[i].cost) return;
    const card = game.hand[i];
    game.energy -= card.cost;
    game.hand.splice(i, 1);
    game.discard.push(card);

    if (card.type === 'attack' || card.type === 'power') {
        let dmg = card.dmg + game.dmg_bonus;
        if (card.hits) dmg *= card.hits;
        game.enemy.hp -= dmg;
        addLog(`${card.icon} ${card.name}: ${dmg} урона`);
        if (card.poison) game.enemy.poison = (game.enemy.poison || 0) + card.poison;
        if (card.burn) game.enemy.burn = (game.enemy.burn || 0) + card.burn;
    } else {
        game.block += card.block;
        addLog(`${card.icon} ${card.name}: +${card.block}`);
    }
    updateDisplay();
}

function endTurn() {
    game.turn++;
    addLog('---Ход врага---');

    if (game.poison > 0) {
        game.enemy.hp -= game.poison;
        addLog(`☠ Яд: ${game.poison}`);
        game.poison--;
    }
    if (game.burn > 0) {
        game.enemy.hp -= game.burn;
        addLog(`🔥 Огонь: ${game.burn}`);
        game.burn--;
    }

    const action = game.enemy.actions[game.enemy.idx % game.enemy.actions.length];
    game.enemy.idx++;

    if (action === 'attack') {
        const dmg = Math.max(1, game.enemy.dmg - Math.floor(game.block / 2));
        game.hp -= dmg;
        addLog(`${game.enemy.emoji} атака: ${dmg} урона`, 1);
        game.block = 0;
    } else if (action === 'heavy') {
        const dmg = Math.max(1, game.enemy.dmg * 2 - Math.floor(game.block / 2));
        game.hp -= dmg;
        addLog(`${game.enemy.emoji} МОЩНАЯ: ${dmg}!`, 1);
        game.block = 0;
    } else if (action === 'defend') {
        game.enemy.block += 8;
        addLog(`${game.enemy.emoji} защита +8`);
    }

    if (game.enemy.hp <= 0) { win(); return; }
    if (game.hp <= 0) { lose(); return; }

    game.energy = game.maxEnergy;
    drawCards(game.draw_per_turn);
    addLog('Новая рука');
    updateDisplay();
}

function win() {
    game.kills++;
    game.gold += 20 + Math.floor(game.floor * 5);
    addLog(`${game.enemy.emoji} побежден!`, 1);

    document.getElementById('reward-modal').classList.add('on');
    const chosen = [];
    const keys = Object.keys(CARDS);
    for (let i = 0; i < 3; i++) {
        let key;
        do key = keys[Math.floor(Math.random() * keys.length)];
        while (chosen.includes(key));
        chosen.push(key);
    }

    document.getElementById('reward-choices').innerHTML = chosen.map(key => {
        const card = CARDS[key];
        return `<div class="choice" onclick="addCard('${key}')">
            <div class="choice-icon">${card.icon}</div>
            <div class="choice-name">${card.name}</div>
            <div class="choice-desc">${card.rarity}</div>
        </div>`;
    }).join('');
}

function addCard(key) {
    game.deck.push({ ...CARDS[key] });
    document.getElementById('reward-modal').classList.remove('on');
    closReward();
}

function closReward() {
    if (game.battle >= 9) {
        endGame(true);
    } else {
        showPath();
    }
}

function showPath() {
    document.getElementById('path-modal').classList.add('on');
    document.getElementById('path-choices').innerHTML = `
        <div class="choice" onclick="nextEvent('battle')"><div class="choice-icon">⚔</div><div class="choice-name">Бой</div></div>
        <div class="choice" onclick="nextEvent('rest')"><div class="choice-icon">🏥</div><div class="choice-name">Отдых</div></div>
        <div class="choice" onclick="nextEvent('shop')"><div class="choice-icon">🏪</div><div class="choice-name">Магазин</div></div>
        <div class="choice" onclick="nextEvent('treasure')"><div class="choice-icon">💎</div><div class="choice-name">Клад</div></div>
    `;
}

function nextEvent(type) {
    document.getElementById('path-modal').classList.remove('on');
    if (type === 'battle') startBattle();
    else if (type === 'rest') {
        game.hp = Math.min(game.hp + 15, game.maxHp);
        game.battle++;
        if (game.battle >= 9) endGame(true);
        else showPath();
    }
    else if (type === 'shop') {
        if (game.gold >= 50) {
            game.gold -= 50;
            const keys = Object.keys(CARDS).filter(k => CARDS[k].rarity !== 'common');
            game.deck.push({ ...CARDS[keys[Math.floor(Math.random() * keys.length)]] });
        }
        game.battle++;
        if (game.battle >= 9) endGame(true);
        else showPath();
    }
    else if (type === 'treasure') {
        game.gold += 50;
        game.battle++;
        if (game.battle >= 9) endGame(true);
        else showPath();
    }
    updateDisplay();
}

function lose() {
    setTimeout(() => {
        document.getElementById('battle-screen').style.display = 'none';
        endGame(false);
    }, 1000);
}

function endGame(won) {
    document.getElementById('go-title').textContent = won ? '🎉 ПОБЕДА!' : '💀 ПОРАЖЕНИЕ';
    document.getElementById('go-title').style.color = won ? '#4ade80' : '#ff6b6b';
    document.getElementById('stat-kills').textContent = game.kills;
    document.getElementById('stat-floors').textContent = game.floor;
    document.getElementById('stat-relics').textContent = 0;
    document.getElementById('stat-gold').textContent = game.gold;
    document.getElementById('gameover-modal').classList.add('on');
}

function addLog(msg, imp = 0) {
    const el = document.createElement('div');
    el.className = 'msg' + (imp ? ' imp' : '');
    el.textContent = msg;
    document.getElementById('log').insertBefore(el, document.getElementById('log').firstChild);
}

function updateDisplay() {
    const e = game.enemy;
    const eDef = Object.values(ENEMIES).find(x => x.name === e.name);

    document.getElementById('floor').textContent = game.floor;
    document.getElementById('battle').textContent = game.battle;
    document.getElementById('gold').textContent = game.gold;
    document.getElementById('decksize').textContent = game.deck.length + game.discard.length;

    // Enemy
    document.getElementById('emoji').textContent = e.emoji;
    document.getElementById('ename').textContent = e.name + (e.boss ? ' 👑' : '');
    const ePct = Math.max(0, e.hp / eDef.hp);
    const eBar = document.getElementById('ebar');
    eBar.style.width = (ePct * 100) + '%';
    eBar.className = 'fill ' + (ePct > 0.5 ? '' : ePct > 0.25 ? 'yellow' : 'red');
    eBar.textContent = Math.max(0, e.hp) + '/' + eDef.hp;

    const actions = { attack: '⚔', heavy: '💥', defend: '🛡' };
    document.getElementById('intent').textContent = (actions[e.actions[e.idx % e.actions.length]] || '?') + ' ' + e.actions[e.idx % e.actions.length];

    let eEff = '';
    if (e.poison) eEff += ` ☠(${e.poison})`;
    if (e.burn) eEff += ` 🔥(${e.burn})`;
    document.getElementById('eeffects').textContent = eEff;

    // Player
    document.getElementById('hp').textContent = Math.max(0, game.hp);
    document.getElementById('mhp').textContent = game.maxHp;
    document.getElementById('block').textContent = game.block;
    const pPct = game.hp / game.maxHp;
    const pBar = document.getElementById('pbar');
    pBar.style.width = (pPct * 100) + '%';
    pBar.className = 'fill ' + (pPct > 0.5 ? '' : pPct > 0.25 ? 'yellow' : 'red');
    pBar.textContent = Math.max(0, game.hp);

    let pEff = '';
    if (game.poison) pEff += ` ☠(${game.poison})`;
    if (game.burn) pEff += ` 🔥(${game.burn})`;
    document.getElementById('peffects').textContent = pEff;

    // Energy
    document.getElementById('energy').textContent = game.energy;
    const eDots = document.getElementById('energy-dots');
    eDots.innerHTML = '';
    for (let i = 0; i < game.maxEnergy; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot' + (i >= game.energy ? ' empty' : '');
        eDots.appendChild(dot);
    }

    // Hand
    const hand = document.getElementById('hand');
    hand.innerHTML = '';
    game.hand.forEach((card, i) => {
        const el = document.createElement('div');
        el.className = 'card' + (game.energy < card.cost ? ' disabled' : '');
        el.onclick = () => playCard(i);
        el.innerHTML = `
            <div class="card-rarity">${card.rarity}</div>
            <div class="card-cost">${card.cost}</div>
            <div class="card-icon">${card.icon}</div>
            <div class="card-name">${card.name}</div>
            <div class="card-desc">${card.desc}</div>
        `;
        hand.appendChild(el);
    });
}

init();
</script>

</body>
</html>
